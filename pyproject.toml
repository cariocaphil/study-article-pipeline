[project]
name = "study-article-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.2.0",
    "pydantic>=2.13.5",
    "reportlab>=4.4.0",
    "python-dotenv>=1.2.3",
    "streamlit[pdf]>=1.62.0",
]

[dependency-groups]
dev = [
    "pypdf>=6.0.0",
    "pytest>=9.1.1",
    "pyright>=1.1.400",
    "ruff>=0.16.0",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: marks tests that make real Anthropic API calls (deselect with '-m \"not slow\"')",
]

[tool.pyright]
include = ["src", "evals", "tests", "app.py"]
exclude = [
    "output",
    "evals/results",
    "**/__pycache__",
]
typeCheckingMode = "standard"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
